version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: postgis_ikya
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_DB=
    ports:
      - "5432:5432"
    networks:
      - gis_network
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped
    
  geoserver:
    image: kartoza/geoserver:2.28.2
    container_name: geoserver_ikya
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=
      - GEOSERVER_ADMIN_PASSWORD=
      - INITIAL_MEMORY=2G
      - MAXIMUM_MEMORY=4G
    networks:
      - gis_network
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - D:/proyek-gis/data_raster:/data_raster
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.5
    container_name: pgadmin_ikya
    ports:
      - "8500:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=
      - PGADMIN_DEFAULT_PASSWORD=
    networks:
      - gis_network
    restart: unless-stopped
  
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: 
    depends_on:
      - db

volumes:
  postgis_data:
  geoserver_data:

networks:
  gis_network:
    driver: bridge