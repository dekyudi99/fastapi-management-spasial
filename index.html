<!DOCTYPE html>
<html>
<head>
    <title>Web GIS Ikya - GEE Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <h1>Data Satelit dari GEE via GeoServer</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inisialisasi Peta (Koordinat Buleleng/Bali sesuai GEE Anda)
        var map = L.map('map').setView([-8.11, 115.09], 12);

        // 2. Tambahkan Base Map (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 3. Tambahkan Layer dari GeoServer (WMS)
        var geeLayer = L.tileLayer.wms("http://localhost:8080/geoserver/ikya_project/wms", {
            layers: 'ikya_project:layer_gee',
            format: 'image/png',
            transparent: true,
            version: '1.1.1',
            attribution: "Data GEE Ikya"
        });

        geeLayer.addTo(map);
    </script>
</body>
</html>
